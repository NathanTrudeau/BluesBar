version: 1

# Providers are optional. COBALT should work without external LLMs.
providers:
  local:
    enabled: true

  claude:
    enabled: true
    env_key: "ANTHROPIC_API_KEY"
    model: "claude-3-5-sonnet-latest"   # COBALT may override if configured
    max_tokens: 4096

  openai:
    enabled: true
    env_key: "OPENAI_API_KEY"
    model: "gpt-4.1"                    # placeholder; COBALT may override
    max_tokens: 4096

# Routing chooses which provider each role uses by default.
# COBALT may tune this after scan, but must keep Auditor independent of Patchsmith if possible.
routing:
  orchestrator: local
  cartographer: local
  sentinel: local
  qa: local
  patchsmith: claude
  auditor: claude

# Optional guardrails for cost control
budgets:
  monthly_usd_soft_cap: 200
  per_run_usd_soft_cap: 2.00
  degrade_to_local_on_budget_hit: true
